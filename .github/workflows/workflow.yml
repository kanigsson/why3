name: Main workflow


on:
  pull_request:
  push:
  schedule:
    # Prime the caches every Monday
    - cron: 0 1 * * MON

permissions: read-all

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        ocaml-compiler:
          - "4.11.2"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout tree
        uses: actions/checkout@v3

      - name: Set Staging env var (Windows)
        if: ${{matrix.os == 'windows-latest' }}
        run: |
          echo "STAGING_AREA=${{github.workspace}} -replace '\\' '/'" >> $GITHUB_ENV

      - name: Set Staging env var (non-Windows)
        if: ${{matrix.os != 'windows-latest' }}
        run: |
          echo "STAGING_AREA=${{github.workspace}}" >> $GITHUB_ENV

      - name: Check value of staging var
        run: echo ${{env.STAGING_AREA}}

      - name: Set-up OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v2
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - name: Setup Packages
        run: |
          opam depext camlzip zarith re seq why3
          opam install camlzip dune dune-configurator menhir num ocamlgraph re seq yojson zarith sexplib ppx_sexp_conv ppx_deriving

      - run: opam exec -- ./configure --prefix="${{env.STAGING_AREA}}/staging" --enable-relocation --disable-emacs-compilation --disable-hypothesis-selection --disable-js-of-ocaml 

      - run: opam exec -- make

      - run: opam exec -- make install_spark2014

      - name: Upload package
        uses: actions/upload-artifact@v3
        with:
          name: why3pack-${{matrix.os}}
          path: staging
